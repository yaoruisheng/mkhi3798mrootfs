name: Build Ubuntu focal ARM Root Filesystems (Matrix Parallel)

on:
  workflow_dispatch:

jobs:
  build_rootfs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            qemu_binary: qemu-aarch64-static
          - arch: armhf
            qemu_binary: qemu-arm-static

    steps:
      - name: 1. Checkout repository
        uses: actions/checkout@v4

      - name: 2. Install dependencies (debootstrap + QEMU)
        run: |
          sudo apt-get update
          sudo apt-get install -y debootstrap tar curl wget qemu-user-static e2fsprogs

      - name: 3. Build Ubuntu focal ${{ matrix.arch }} rootfs (Stage 1)
        env:
          ROOTFS_DIR: ${{ github.workspace }}/ubuntu_${{ matrix.arch }}
        run: |
          mkdir -p "$ROOTFS_DIR"
          sudo debootstrap --verbose --arch=${{ matrix.arch }} --foreign focal "$ROOTFS_DIR" https://ports.ubuntu.com/ubuntu-ports
          echo -e "deb http://mirrors.aliyun.com/ubuntu-ports focal main restricted\ndeb http://mirrors.aliyun.com/ubuntu-ports focal-updates main restricted\ndeb http://mirrors.aliyun.com/ubuntu-ports focal universe\ndeb http://mirrors.aliyun.com/ubuntu-ports focal-updates universe\ndeb http://mirrors.aliyun.com/ubuntu-ports focal multiverse\ndeb http://mirrors.aliyun.com/ubuntu-ports focal-updates multiverse\ndeb http://mirrors.aliyun.com/ubuntu-ports focal-backports main restricted universe multiverse\ndeb http://mirrors.aliyun.com/ubuntu-ports focal-security main restricted\ndeb http://mirrors.aliyun.com/ubuntu-ports focal-security universe\ndeb http://mirrors.aliyun.com/ubuntu-ports focal-security multiverse" | sudo tee "$ROOTFS_DIR/etc/apt/sources.list"

      - name: 4. Run Stage 2 inside chroot (via QEMU) & Configure System
        env:
          ROOTFS_DIR: ${{ github.workspace }}/ubuntu_${{ matrix.arch }}
        run: |
          sudo cp /usr/bin/${{ matrix.qemu_binary }} "$ROOTFS_DIR/usr/bin/"
          echo "localhost" | sudo tee "$ROOTFS_DIR/etc/hostname" 
          sudo mount -t proc /proc "$ROOTFS_DIR/proc"
          sudo mount --rbind /sys "$ROOTFS_DIR/sys"
          sudo mount --make-rslave "$ROOTFS_DIR/sys"
          sudo mount --rbind /dev "$ROOTFS_DIR/dev"
          sudo mount --make-rslave "$ROOTFS_DIR/dev"
          sudo chroot "$ROOTFS_DIR" /debootstrap/debootstrap --second-stage
          sudo chroot "$ROOTFS_DIR" sh -c 'echo "root:ubuntu123" | chpasswd'
          echo "Install locales tzdata dropbear sudo"
          sudo chroot "$ROOTFS_DIR" /bin/bash -c '
            apt-get update
            apt-get install -y locales tzdata dropbear sudo
          '          
          sudo install -d "$ROOTFS_DIR/usr/local/bin"
          sudo install -m 0755 tools/mkbootargs_${{ matrix.arch }} "$ROOTFS_DIR/usr/local/bin/mkbootargs"
          sudo install -m 0644 tools/bootargs_input.txt "$ROOTFS_DIR/etc/bootargs_input.txt"
          sudo install -m 0755 tools/local-resize2fs.sh "$ROOTFS_DIR/root/local-resize2fs.sh"
          sudo install -m 0755 tools/growpart "$ROOTFS_DIR/root/growpart"
          sudo install -m 0755 tools/resize2fs_${{ matrix.arch }} "$ROOTFS_DIR/root/resize2fs"
          sudo install -m 0644 files/01-all-eth.yaml "$ROOTFS_DIR/etc/netplan/01-all-eth.yaml"
          echo "Enable systemd-networkd"
          sudo chroot "$ROOTFS_DIR" /bin/bash -c '
            systemctl enable systemd-networkd
            systemctl enable systemd-resolved
            ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
          '
          echo "Locale-gen"
          sudo chroot "$ROOTFS_DIR" /bin/bash -c '
            export DEBIAN_FRONTEND=noninteractive
            locale-gen en_US.UTF-8 zh_CN.UTF-8
            update-locale LANG=en_US.UTF-8
          '
          sudo chroot "$ROOTFS_DIR" /bin/bash -c '
            echo "kernel.printk = 3 4 1 7" > /etc/sysctl.d/99-quiet-console.conf
          '
          sudo chroot "$ROOTFS_DIR" /bin/bash -c '
            useradd -m -s /bin/bash user
            echo "user:ubuntu123" | chpasswd
            usermod -aG sudo user
            echo "user ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/user
            chmod 0440 /etc/sudoers.d/user
          '
          echo "install old systemd-udevd"
          wget -O libudev1.deb https://ports.ubuntu.com/ubuntu-ports/pool/main/s/systemd/libudev1_237-3ubuntu10.57_${{ matrix.arch }}.deb
          wget -O udev.deb https://ports.ubuntu.com/ubuntu-ports/pool/main/s/systemd/udev_237-3ubuntu10.57_${{ matrix.arch }}.deb
          sudo cp libudev1.deb udev.deb "$ROOTFS_DIR/root/"
          sudo chroot "$ROOTFS_DIR" /bin/bash -c '
            dpkg --purge --force-depends libudev1 udev
            dpkg -i /root/libudev1.deb
            dpkg -i /root/udev.deb
            apt-mark hold libudev1 udev
            rm -f /root/libudev1.deb /root/udev.deb
          '
          echo -e "Package: libudev1\nPin: version 237-3ubuntu10.57\nPin-Priority: 1001\n\nPackage: udev\nPin: version 237-3ubuntu10.57\nPin-Priority: 1001" | sudo tee "$ROOTFS_DIR/etc/apt/preferences.d/udev-pin.pref"
          echo "fixed newer systemd running lower kernel 4.4.35"
          wget -O systemd.deb https://ports.ubuntu.com/ubuntu-ports/pool/main/s/systemd/systemd_237-3ubuntu10.57_${{ matrix.arch }}.deb
          mkdir systemd237
          dpkg-deb -x systemd.deb systemd237
          sudo install -m 0644 systemd237/lib/systemd/libsystemd-shared-237.so "$ROOTFS_DIR/usr/lib/systemd/libsystemd-shared-237.so"
          sudo install -m 0755 systemd237/lib/systemd/systemd-journald "$ROOTFS_DIR/usr/lib/systemd/systemd-journald237"
          sudo install -m 0755 systemd237/bin/journalctl "$ROOTFS_DIR/usr/bin/journalctl237"
          sudo chroot "$ROOTFS_DIR" /bin/bash -c '
            mv /usr/lib/systemd/systemd-journald /usr/lib/systemd/systemd-journald-backup
            ln -s /lib/systemd/systemd-journald237 /usr/lib/systemd/systemd-journald
            mv /usr/bin/journalctl /usr/bin/journalctl-backup
            ln -s /bin/journalctl237 /usr/bin/journalctl
            mv /usr/bin/systemd-sysusers /usr/bin/systemd-sysusers-backup
            ln -sf /bin/systemd-sysusers237 /usr/bin/systemd-sysusers
          '
          echo -e "DPkg::Post-Invoke {\"if grep -qE 'systemd' /var/log/dpkg.log; then ln -sf /lib/systemd/systemd-journald229 /lib/systemd/systemd-journald && ln -sf /bin/journalctl229 /bin/journalctl && logger -t systemd-guard 'systemd updated, relinked to old version' || true; fi\";};" | sudo tee "$ROOTFS_DIR/etc/apt/apt.conf.d/99-systemd-guard"
          sudo chroot "$ROOTFS_DIR" /bin/bash -c '
            apt-get clean
            rm -rf /var/log/* /tmp/* /usr/share/doc/* /usr/share/man/* /usr/share/info/* /var/lib/apt/lists/*
          '
          sudo rm -f "$ROOTFS_DIR/usr/bin/${{ matrix.qemu_binary }}"
          sudo umount -lf "$ROOTFS_DIR/proc" || true
          sudo umount -lf "$ROOTFS_DIR/sys" || true
          sudo umount -lf "$ROOTFS_DIR/dev" || true

      - name: 5. Create 512MB ext4 RootFS image + compress
        id: gzip
        env:
          ROOTFS_DIR: ${{ github.workspace }}/ubuntu_${{ matrix.arch }}
        run: |
          set -e
          IMG_NAME=ubuntu-${{ matrix.arch }}-rootfs.img
          IMG_SIZE=512M
          IMG_UUID=0232c92b-598e-4a2a-a9db-8348ec69c7e4
          MNT_DIR=${{ github.workspace }}/mnt-rootfs-${{ matrix.arch }}
          truncate -s $IMG_SIZE $IMG_NAME
          mkfs.ext4 -F -U $IMG_UUID -L rootfs $IMG_NAME
          mkdir -p $MNT_DIR
          sudo mount -o loop $IMG_NAME $MNT_DIR
          sudo cp -a $ROOTFS_DIR/. $MNT_DIR/
          sudo umount $MNT_DIR
          rmdir $MNT_DIR
          gzip -c $IMG_NAME > ${IMG_NAME}.gz
          echo "TARBALL_NAME=${IMG_NAME}.gz" >> $GITHUB_OUTPUT

      - name: 6. Upload RootFS Image Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-rootfs-${{ matrix.arch }}
          path: ${{ steps.gzip.outputs.TARBALL_NAME }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build_rootfs
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release_artifacts

      - name: Flatten artifact directories
        run: |
          find ./release_artifacts -name "*.gz" -exec mv {} ./release_artifacts/ \;
          find ./release_artifacts -type d -empty -delete
          ls -lh ./release_artifacts

      - name: Generate release tag
        id: date
        run: echo "RELEASE_TAG=v$(date +'%Y.%m.%d').${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release + upload assets
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.date.outputs.RELEASE_TAG }}
          name: Ubuntu focal ARM RootFS Build ${{ steps.date.outputs.RELEASE_TAG }}
          body: |
            ## 🚀 自动生成的Ubuntu focal ARM Root Filesystem

            包含以下架构的最小化 RootFS：

            - **ARM64**（aarch64）
            - **ARMHF**（armv7 硬浮点）

            **系统配置要点:**
            - **root 初始密码：ubuntu123** 🚨
            - **user 初始密码：ubuntu123** 🚨 
            - (请在首次登录后立即修改!)
          files: ./release_artifacts/*.gz
